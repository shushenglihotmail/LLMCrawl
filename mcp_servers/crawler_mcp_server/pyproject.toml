[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawler-mcp-server"
version = "0.2.0"
description = "MCP server for LLMCrawl with container management, auth, and optional native service"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "LLMCrawl" }]
keywords = [
    "mcp",
    "crawler",
    "rag",
    "llmcrawl",
    "firecrawl",
    "playwright",
    "docker",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = ["httpx>=0.25.0"]

[project.optional-dependencies]
# Full service: run crawler natively without Docker
service = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.4.0",
    "playwright>=1.40.0",
    "trafilatura>=1.6.0",
    "lxml>=4.9.0",
    "beautifulsoup4>=4.12.0",
    "python-multipart>=0.0.6",
    "asyncio-throttle>=1.0.2",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "msal>=1.26.0",
]

# Auth support for internal sites
auth = ["websocket-client>=1.6.0"]

# Development dependencies
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]

# All features
all = ["crawler-mcp-server[service,auth]"]

[project.scripts]
crawler-mcp-server = "crawler_mcp_server.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["crawler_mcp_server*"]

[tool.setuptools.package-data]
"crawler_mcp_server" = [
    "*.jsonc",
    "*.md",
    "*.yml",
    "*.yaml",
    "*.txt",
    "Dockerfile.*",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 88
