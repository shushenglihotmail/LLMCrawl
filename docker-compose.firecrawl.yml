version: '3.8'

services:
  firecrawl:
    image: ghcr.io/firecrawl/firecrawl:latest
    container_name: web-rag-firecrawl-standalone
    ports:
      - "3002:3002"
    environment:
      # Use a lightweight in-memory setup for testing
      - NODE_ENV=development
      - USE_DB_AUTHENTICATION=false
      - REDIS_URL=redis://redis:6379
      - NUM_WORKERS=1
    networks:
      - webrag-network
    depends_on:
      - redis
    volumes:
      - firecrawl_data:/data

volumes:
  firecrawl_data:

networks:
  webrag-network:
    external: true
