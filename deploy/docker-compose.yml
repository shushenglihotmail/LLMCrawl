services:
  # Vector Database - Qdrant
  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: web-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - webrag-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL with pgvector (alternative)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: web-rag-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=firecrawl
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./nuq.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - webrag-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: web-rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - webrag-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Milvus - Vector database for memory service (milvus-lite doesn't support Windows)
  milvus:
    image: milvusdb/milvus:v2.5.5
    container_name: web-rag-milvus
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      - ETCD_USE_EMBED=true
      - ETCD_DATA_DIR=/var/lib/milvus/etcd
      - COMMON_STORAGETYPE=local
    volumes:
      - milvus_data:/var/lib/milvus
    networks:
      - webrag-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9091/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Playwright/Browserless Service - fallback for JS-heavy pages
  playwright:
    image: ghcr.io/firecrawl/playwright-service:latest
    container_name: web-rag-playwright
    ports:
      - "3003:3003"
    environment:
      - CONCURRENT=5
      - TIMEOUT=300000
    networks:
      - webrag-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3003/health', (res) => { if (res.statusCode === 200) process.exit(0); else process.exit(1); }).on('error', (err) => process.exit(1));\""]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Firecrawl Service - Configured to use external PostgreSQL
  firecrawl:
    image: ghcr.io/firecrawl/firecrawl:latest
    container_name: web-rag-firecrawl
    ports:
      - "3002:3002"
    environment:
      - REDIS_URL=redis://redis:6379
      - REDIS_RATE_LIMIT_URL=redis://redis:6379
      - DATABASE_URL=postgres://postgres:password@postgres:5432/firecrawl
      - NUQ_DATABASE_URL=postgres://postgres:password@postgres:5432/firecrawl
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=password
      - PGDATABASE=firecrawl
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=firecrawl
      - USE_DB_AUTHENTICATION=false
      - NODE_ENV=production
      - NUM_WORKERS_PER_QUEUE=1
      - PORT=3002
      - HOST=0.0.0.0
      - PLAYWRIGHT_MICROSERVICE_URL=http://playwright:3003/scrape
      - SCRAPE_TIMEOUT=120000
    networks:
      - webrag-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      playwright:
        condition: service_healthy
    # Run main API directly, skip harness setup (avoids docker-in-docker requirement)
    command: ["node", "dist/src/index.js"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const s = require('net').createConnection(3002, 'localhost', () => { s.end(); process.exit(0); }); s.on('error', () => process.exit(1)); setTimeout(() => process.exit(1), 5000);\""]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Gateway runs locally (not containerized) - start with: python -m uvicorn gateway.main:app
  # Memory Service runs locally (not containerized) - start with: python -m uvicorn services.memory_service.main:app

  # Crawler Service
  crawler:
    build:
      context: .
      dockerfile: Dockerfile.crawler
    container_name: web-rag-crawler
    ports:
      - "8001:8001"
    environment:
      - CRAWLER_HOST=0.0.0.0
      - CRAWLER_PORT=8001
      - FIRECRAWL_URL=http://firecrawl:3002
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - RELOAD=true
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - /tmp:/tmp
      - ./crawler:/app/crawler:rw
    networks:
      - webrag-network
    depends_on:
      - firecrawl
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: uvicorn crawler.main:app --host 0.0.0.0 --port 8001 --reload
    restart: unless-stopped

  # Indexer Service
  indexer:
    build:
      context: .
      dockerfile: Dockerfile.indexer
    container_name: web-rag-indexer
    ports:
      - "8002:8002"
    environment:
      - INDEXER_HOST=0.0.0.0
      - INDEXER_PORT=8002
      - QDRANT_URL=http://qdrant:6333
      - PG_DSN=postgresql://postgres:password@postgres:5432/rag_db
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - RELOAD=true
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./indexer:/app/indexer:rw
    networks:
      - webrag-network
    depends_on:
      - qdrant
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: uvicorn indexer.main:app --host 0.0.0.0 --port 8002 --reload
    restart: unless-stopped

  # Azure DevOps MCP Server
  azure-devops-mcp-server:
    build:
      context: ./mcp_servers/azure_devops_mcp_server
      dockerfile: Dockerfile
    container_name: web-rag-azure-devops-mcp
    ports:
      - "8004:8004"
    environment:
      - MCP_MODE=http
      - MCP_PORT=8004
      - MCP_HOST=0.0.0.0
      - AZURE_DEVOPS_ORG=microsoft
      - AZURE_DEVOPS_PROJECT=OS
      - AZURE_DEVOPS_REPO=os.2020
      - AZURE_DEVOPS_BRANCH=official/rs_sparc_ctr_exp
      - AZURE_DEVOPS_MAX_RESULTS=50
      - AZURE_DEVOPS_AUTH_MODE=pat
      # Set AZURE_DEVOPS_PAT in .env file
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - azure_devops_cache:/app/.mcp_cache
    networks:
      - webrag-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8004/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Demo Web Client (optional)
  demo-client:
    build:
      context: .
      dockerfile: Dockerfile.demo
    container_name: web-rag-demo
    ports:
      - "3000:3000"
    environment:
      - GATEWAY_URL=http://host.docker.internal:8000
    volumes:
      - ./clients/demo:/app
    networks:
      - webrag-network
    profiles:
      - demo

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: web-rag-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - webrag-network
    profiles:
      - monitoring

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: web-rag-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning
    networks:
      - webrag-network
    depends_on:
      - prometheus
    profiles:
      - monitoring

volumes:
  qdrant_data:
  postgres_data:
  redis_data:
  milvus_data:
  prometheus_data:
  grafana_data:
  azure_devops_cache:

networks:
  webrag-network:
    external: true
    name: webrag-network
    driver: bridge
