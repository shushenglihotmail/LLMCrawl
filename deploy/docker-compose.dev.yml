services:
  # Override services for development with volume mounts for hot reload
  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile.gateway
    container_name: web-rag-gateway-dev
    ports:
      - "8000:8000"
    volumes:
      - ./gateway:/app/gateway:rw
      - ./requirements:/app/requirements:ro
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - RELOAD=true
      - MCP_SERVER_URL=http://web-rag-mcp-server:8003
      - AZURE_DEVOPS_MCP_URL=http://web-rag-azure-devops-mcp:8004
    networks:
      - webrag-network
    depends_on:
      - qdrant
      - redis
      - crawler
      - indexer
    command: uvicorn gateway.main:app --host 0.0.0.0 --port 8000 --reload

  crawler:
    build:
      context: .
      dockerfile: deploy/Dockerfile.crawler
    container_name: web-rag-crawler-dev
    ports:
      - "8001:8001"
    volumes:
      - ./crawler:/app/crawler:rw
      - ./requirements:/app/requirements:ro
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - RELOAD=true
      - FIRECRAWL_URL=http://firecrawl:3002
    networks:
      - webrag-network
    depends_on:
      - redis
      - firecrawl
    command: uvicorn crawler.main:app --host 0.0.0.0 --port 8001 --reload

  indexer:
    build:
      context: .
      dockerfile: deploy/Dockerfile.indexer
    container_name: web-rag-indexer-dev
    ports:
      - "8002:8002"
    volumes:
      - ./indexer:/app/indexer:rw
      - ./requirements:/app/requirements:ro
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - RELOAD=true
    networks:
      - webrag-network
    depends_on:
      - qdrant
      - postgres
      - redis
    command: uvicorn indexer.main:app --host 0.0.0.0 --port 8002 --reload

  # Development tools
  redis-cli:
    image: redis:7-alpine
    container_name: web-rag-redis-cli
    networks:
      - webrag-network
    profiles:
      - tools
    command: redis-cli -h redis
    depends_on:
      - redis

  # Firecrawl Service - Simplified setup
  firecrawl:
    image: ghcr.io/firecrawl/firecrawl:latest
    container_name: web-rag-firecrawl-dev
    ports:
      - "3002:3002"
    environment:
      - REDIS_URL=redis://redis:6379
      - USE_DB_AUTHENTICATION=false
      - DISABLE_AUTHENTICATION=true
      - NODE_ENV=development
      - NUM_WORKERS=1
      - PORT=3002
    networks:
      - webrag-network
    depends_on:
      - redis
    restart: unless-stopped

  # MCP Server for local file operations
  mcp-server:
    build:
      context: .
      dockerfile: deploy/Dockerfile.mcp_server
    container_name: web-rag-mcp-server
    ports:
      - "8003:8003"
    volumes:
      - ./mcp_servers/local_access_mcp_server:/app/mcp_server:rw
      - C:/os:/data/files  # Mount local C:\os folder
      - mcp_vector_db:/data/mcp_vector_db
    environment:
      - MCP_ROOT_FOLDER=/data/files
      - MCP_VECTOR_DB_PATH=/data/mcp_vector_db
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    networks:
      - webrag-network
    restart: unless-stopped

networks:
  webrag-network:
    external: true

volumes:
  mcp_vector_db:
