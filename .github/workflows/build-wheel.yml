name: Build and Release Wheels

on:
  release:
    types: [created]
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools

      - name: Build main LLMCrawl wheel
        run: python -m build --wheel

      - name: Build MCP server wheels
        run: |
          # Find all MCP servers with pyproject.toml and build them
          for dir in mcp_servers/*/; do
            if [ -f "${dir}pyproject.toml" ]; then
              echo "Building wheel for ${dir}..."
              python -m build --wheel --outdir dist/ "${dir}"
            fi
          done

      - name: List all built wheels
        run: ls -la dist/

      - name: Upload all wheels as artifact
        uses: actions/upload-artifact@v4
        with:
          name: llmcrawl-wheels
          path: dist/*.whl

      - name: Upload wheels to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
