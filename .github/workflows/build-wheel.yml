name: Build and Release

on:
  release:
    types: [created]
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  packages: write

jobs:
  build-wheels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools

      - name: Build main LLMCrawl wheel
        run: python -m build --wheel

      - name: Build MCP server wheels
        run: |
          # Find all MCP servers with pyproject.toml and build them
          for dir in mcp_servers/*/; do
            if [ -f "${dir}pyproject.toml" ]; then
              echo "Building wheel for ${dir}..."
              python -m build --wheel --outdir dist/ "${dir}"
            fi
          done

      - name: List all built wheels
        run: ls -la dist/

      - name: Upload all wheels as artifact
        uses: actions/upload-artifact@v4
        with:
          name: llmcrawl-wheels
          path: dist/*.whl

      - name: Upload wheels to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-memory-service:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            # Remove 'v' prefix if present (v1.2.3 -> 1.2.3)
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "tag_latest=true" >> $GITHUB_OUTPUT
          else
            # For manual trigger, use commit SHA
            echo "version=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "tag_latest=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push memory-service image
        uses: docker/build-push-action@v5
        with:
          context: ./services/memory_service
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/memory-service:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.tag_latest == 'true' && format('ghcr.io/{0}/memory-service:latest', github.repository_owner) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
