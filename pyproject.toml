[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmcrawl"
version = "1.0.1"
description = "Web RAG System with LLM-powered crawling and indexing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "LLMCrawl Team" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.104.0",
  "uvicorn>=0.24.0",
  "httpx>=0.25.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
client = [
  "fastapi>=0.104.0",
  "uvicorn>=0.24.0",
  "httpx>=0.25.0",
  "msal>=1.28.0",
  "python-dotenv>=1.0.0",
]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "pytest-asyncio>=0.21.0",
  "black>=23.0.0",
  "isort>=5.12.0",
  "flake8>=6.0.0",
  "mypy>=1.0.0",
]

[project.scripts]
hichat = "clients.hichat.main:main"
llmcrawl = "llmcrawl_cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
  "clients*",
  "gateway*",
  "crawler*",
  "indexer*",
  "mcp_servers*",
  "llmcrawl_cli*",
  "deploy*",
  "tools*",
  "docs*",
]
exclude = ["tests*", "ref*", "logs*"]

[tool.setuptools.package-data]
"*" = ["static/*", "static/**/*"]
"deploy" = [
  "*.yml",
  "*.yaml",
  "*.env.example",
  ".env.example",
  "Dockerfile.*",
  "prometheus.yml",
  "nuq.sql",
  "requirements/*",
  "grafana-provisioning/*",
  "grafana-provisioning/**/*",
  "README.md",
  "data/files/*",
]
"docs" = ["*.md"]
"mcp_servers.azure_devops_mcp_server" = ["Dockerfile", "*.toml"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --cov=. --cov-report=term-missing"
testpaths = ["tests", "gateway/tests", "crawler/tests", "indexer/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["gateway", "crawler", "indexer"]
omit = ["*/tests/*", "*/venv/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
]
